name: e_commerce
description: "TH4 - Nhom 11: Mini E-Commerce App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Image loading & caching
  cached_network_image: ^3.4.1

  # UI Components
  carousel_slider: ^5.0.0
  badges: ^3.1.2
  shimmer: ^3.0.0

  # Local persistence (for cart)
  shared_preferences: ^2.3.2
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
